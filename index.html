---
layout: default
---
<!-- Every image in /img/photos/ shows up here on its own. Nothing to edit:
     drop photos in ../inbox_photos and run ./publish.sh -->
{%- assign photos = site.static_files | where_exp: "f", "f.path contains '/img/photos/'" | sort: "name" %}

<div class="grid">
{%- for photo in photos %}
	<a href="{{ photo.path | prepend: site.baseurl }}">
		<img src="{{ photo.path | prepend: site.baseurl }}" loading="lazy" alt="">
	</a>
{%- endfor %}
</div>
