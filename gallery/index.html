---
layout: page
title: "PHOTOS"
description: ""
active: gallery
header-img: "img/gallery-bg.jpg"
---

<!-- Every image file in /img/photos/ appears here automatically - there is no
     list to maintain. Drop photos in ../inbox_photos and run ./publish.sh. -->
{% assign photos = site.static_files | where_exp: "f", "f.path contains '/img/photos/'" | sort: "name" %}

<div class="gallery masonry-gallery">
{% for image in photos %}
	<figure class="gallery-item">
		<header class="gallery-icon">
			<a href="{{ image.path | prepend: site.baseurl }}" class="popup">
				<img src="{{ image.path | prepend: site.baseurl }}" loading="lazy" alt="">
			</a>
		</header>
	</figure>
{% endfor %}
</div>

<script src="//ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="{{ site.baseurl }}/js/jquery.magnific-popup.js"></script>
<script src="{{ site.baseurl }}/js/isotope.pkgd.min.js"></script>
<script src="{{ site.baseurl }}/js/scripts.js"></script>

<script>
jQuery(function($) {
	$('a.popup').magnificPopup({
		type: 'image',
		gallery: { enabled: true, navigateByImgClick: true, preload: [0, 1] }
	});

	// lazy-loaded images have no height when isotope first measures them,
	// so re-run the layout as each one arrives
	$('.masonry-gallery img').on('load', function() {
		$('.masonry-gallery.gallery').isotope('layout');
	});
});
</script>
